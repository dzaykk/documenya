[project]
name = "documenya"
version = "0.1.0"
description = "AI-powered document processing API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi",
    "uvicorn[standard]",
    # Database
    "sqlalchemy>=2.0",
    "asyncpg",
    "psycopg[binary]",
    "greenlet",
    "alembic",
    # Validation
    "pydantic[email]>=2",
    "pydantic-settings",
    # Auth
    "pwdlib[argon2]",
    "python-jose[cryptography]",
    "python-multipart",
    # Storage
    "aiofiles",
    # Document parsing
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    # Background tasks
    "celery>=5.4",
    "redis[hiredis]>=5.0",
    "qdrant-client>=1.18.0",
    "openai>=2.50.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "structlog>=26.1.0",
    "orjson>=3.11.9",
    "tiktoken>=0.13.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.1",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "accelerate>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",

    "ruff",
    "mypy",

    "pre-commit",

    "types-python-jose",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "."
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
